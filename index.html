<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="校园美食地图助手：定位、搜索周边餐厅并在地图上查看位置" />
  <title>校园美食地图助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🍜</span>
        <div class="brand-text">
          <h1>校园美食地图</h1>
          <p>定位 · 搜索 · 一键找到今天的饭</p>
        </div>
      </div>
      <div class="place" id="placeBox">
        <span class="place-pin" aria-hidden="true">📍</span>
        <div class="place-text">
          <strong id="addressText">正在定位…</strong>
          <span id="addressSub">正在获取当前位置</span>
        </div>
        <span class="badge badge-mock" id="addressBadge" hidden>示例位置</span>
      </div>
    </div>

    <form class="search-bar" id="searchForm" autocomplete="off">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input id="searchInput" type="search" placeholder="搜索美食，如：川菜、日料、奶茶、牛肉面" aria-label="搜索美食关键词" />
      <button type="submit" id="searchBtn">搜索</button>
    </form>

    <div class="filter-bar" id="filterBar" aria-label="价格与口味筛选">
      <div class="filter-group" role="group" aria-label="价格筛选">
        <span class="filter-label">价格</span>
        <button class="chip is-active" type="button" data-price="all">全部</button>
        <button class="chip" type="button" data-price="low">平价 &lt;30</button>
        <button class="chip" type="button" data-price="mid">中档 30-80</button>
        <button class="chip" type="button" data-price="high">高档 &gt;80</button>
      </div>
      <div class="filter-group" role="group" aria-label="口味筛选">
        <span class="filter-label">口味</span>
        <button class="chip is-active" type="button" data-taste="all">全部</button>
        <button class="chip" type="button" data-taste="川菜">川菜</button>
        <button class="chip" type="button" data-taste="粤菜">粤菜</button>
        <button class="chip" type="button" data-taste="日料">日料</button>
        <button class="chip" type="button" data-taste="西餐">西餐</button>
        <button class="chip" type="button" data-taste="小吃">小吃</button>
        <button class="chip" type="button" data-taste="奶茶">奶茶</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel list-panel" aria-labelledby="listTitle">
      <div class="panel-head">
        <div>
          <h2 id="listTitle">推荐结果</h2>
          <p class="result-meta" id="resultMeta">—</p>
        </div>
        <div class="sort-group" role="group" aria-label="排序方式">
          <button class="sort-btn is-active" type="button" id="sortDistance" aria-pressed="true">距离最近</button>
          <button class="sort-btn" type="button" id="sortRating" aria-pressed="false">评分最高</button>
        </div>
      </div>

      <div class="notice" id="notice" hidden></div>
      <ul class="card-list" id="cardList" aria-live="polite"></ul>
      <div class="empty" id="emptyState" hidden>
        <p>没有找到匹配的美食</p>
        <span>换个关键词，或调整价格、口味筛选条件试试</span>
      </div>
      <div class="skeleton" id="skeleton" hidden>
        <div class="sk-row"></div>
        <div class="sk-row"></div>
        <div class="sk-row"></div>
      </div>
    </section>

    <section class="panel map-panel" aria-labelledby="mapTitle">
      <div class="panel-head map-head">
        <h2 id="mapTitle">地图</h2>
        <span class="badge badge-map" id="mapBadge">正在准备地图</span>
      </div>
      <div class="map-stage">
        <div id="amapMap" class="map-layer" aria-label="高德地图"></div>
        <div id="localMap" class="map-layer local-map" aria-label="本地示意地图">
          <div class="plane" id="localPlane">
            <div class="plane-grid"></div>
            <div class="plane-road road h1"></div>
            <div class="plane-road road h2"></div>
            <div class="plane-road road v1"></div>
            <div class="plane-road road v2"></div>
            <div class="plane-block b1"></div>
            <div class="plane-block b2"></div>
            <div class="plane-block b3"></div>
            <div class="plane-center" title="当前位置"></div>
            <div id="localMarkers"></div>
          </div>
          <div class="map-tip" id="mapTip">本地示意地图 · 可拖动、缩放、点击红点查看详情</div>
          <div class="zoom-controls">
            <button type="button" id="zoomIn" aria-label="放大地图">+</button>
            <button type="button" id="zoomOut" aria-label="缩小地图">−</button>
            <button type="button" id="zoomReset" aria-label="回到当前位置" title="回到当前位置">◎</button>
          </div>
          <div class="local-info" id="localInfo" hidden></div>
        </div>
        <div class="map-loading" id="mapLoading" hidden>正在连接高德地图…</div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>数据来源：高德开放平台（IP 定位 / 逆地理编码 / POI 搜索）</span>
    <span>接口或地图不可用时自动使用示例数据，仅用于演示</span>
  </footer>

  <script src="config.local.js"></script>
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
